name: bayesian-regime-engine
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - pip=23.3
  - numpy=1.26.4
  - pandas=2.2.1
  - scipy=1.12.0
  - scikit-learn=1.4.1
  - statsmodels=0.14.1
  - pyarrow=15.0.0
  - pydantic=2.6.4
  - pyyaml=6.0.1
  - matplotlib=3.8.3
  - seaborn=0.13.2
  - tqdm=4.66.2
  - pytest=8.0.2
  - pytest-cov=4.1.0
  - ruff=0.3.0
  - black=24.2.0
  - mypy=1.8.0
  # R runtime & R core packages
  - r-base>=4.3.0
  - r-essentials
  - r-depmixs4
  - r-forecast
  - r-tseries
  - r-tidyverse
  - r-yaml
  - r-jsonlite
  - pip:
      - hmmlearn>=0.3.2
      - pymc>=5.10.4
      - arviz>=0.17.0
      - pyro-ppl>=1.8.6
      - torch>=2.2.0
      - torchvision>=0.17.0
      - transformers>=4.38.2
      - accelerate>=0.27.2
      - einops>=0.7.0
      - crepes>=0.7.2
      - mapie>=0.8.0
      - yfinance>=0.2.37
