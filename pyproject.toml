[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-regime-detection-engine"
version = "0.1.0"
description = "Bayesian Regime Detection Engine for Equity Direction Forecasting - Confidential Quantitative Research Project (Zetheta Algorithms)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Quantitative Research Team", email = "research@zetheta.internal" }
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "statsmodels>=0.14.0",
    "hmmlearn>=0.3.0",
    "arviz>=0.16.0",
    "pymc>=5.10.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.66.0",
    "yfinance>=0.2.35",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.12",
]
deeplearning = [
    "pyro-ppl>=1.8.6",
    "einops>=0.7.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
]
conformal = [
    "crepes>=0.7.0",
    "mapie>=0.8.0",
]
tda_gnn = [
    "giotto-tda>=0.6.0",
    "torch-geometric>=2.4.0",
    "networkx>=3.1",
]
foundation = [
    "huggingface-hub>=0.20.0",
    "chronos-forecasting>=0.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: fast unit tests",
    "integration: integration tests connecting multiple modules",
    "statistical: statistical tests verifying mathematical invariants",
    "leakage: strict tests verifying zero temporal look-ahead bias",
    "slow: computationally demanding tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
