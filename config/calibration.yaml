# Configuration for Conformal Prediction & Calibration
# Zetheta Algorithms - Bayesian Regime Detection Engine

conformal_prediction:
  nominal_alpha: 0.10  # 90% nominal target marginal coverage (does not assume realized == 90%)
  report_realized_coverage: true
  track_rolling_coverage: true
  track_stress_period_coverage: true
  method: "adaptive_prediction_sets"  # split_conformal, adaptive_prediction_sets (APS)
  distribution_shift_robust:
    enabled: true
    algorithm: "aci"  # aci (Adaptive Conformal Inference), mondrian
    aci_learning_rate_gamma: 0.01

calibration_metrics:
  n_bins: 10
  strategy: "uniform"  # uniform, quantile
  report_ece: true
  compute_brier: true
  rolling_ece_window_days: 63  # ~1 quarter
  document_calibration_failures: true
