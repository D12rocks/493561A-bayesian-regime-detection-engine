# Configuration for Data Ingestion, Cleaning & Assets
# Zetheta Algorithms - Bayesian Regime Detection Engine

universe:
  equities:
    nifty_50:
      symbol: "^NSEI"
      name: "Nifty 50 Index"
      source: "yahoo"
      frequency: "daily"
      columns: ["Open", "High", "Low", "Close", "Volume"]
    nifty_midcap_100:
      symbol: "^NSEMDCP50"  # or NIFTY_MIDCAP_100
      name: "Nifty Midcap 100 Index"
      source: "yahoo"
      frequency: "daily"
      columns: ["Close"]
    nifty_smallcap_100:
      symbol: "^NSESMCP"
      name: "Nifty Smallcap 100 Index"
      source: "yahoo"
      frequency: "daily"
      columns: ["Close"]

  volatility:
    india_vix:
      symbol: "^INDIAVIX"
      name: "India VIX"
      source: "yahoo"
      frequency: "daily"
      columns: ["Close"]

  macro_currencies:
    usd_inr:
      symbol: "INR=X"
      name: "USD/INR Exchange Rate"
      source: "yahoo"
      frequency: "daily"
      columns: ["Close"]
      availability:
        lag_type: "same_day_eod"
        lag_days: 0
        status: "verified"
    gilt_10y:
      symbol: "IN10YT=RR"
      name: "India 10Y Benchmark Sovereign Gilt Yield"
      source: "rbi"
      frequency: "daily"
      columns: ["Yield"]
      availability:
        lag_type: "next_day_rbi_bulletin"
        lag_days: 1
        status: "requires_verification"
        fallback_treatment: "quarantine_from_production"
    aaa_gilt_spread:
      name: "AAA Corporate Spread over 10Y Gilt"
      source: "ccil"
      frequency: "daily"
      units: "basis_points"
      availability:
        lag_type: "t_plus_1"
        lag_days: 1
        status: "requires_verification"
        fallback_treatment: "quarantine_from_production"

  flows:
    fii_equity_flow:
      name: "FII/FPI Net Equity Investment"
      source: "nsdl"
      frequency: "daily"
      units: "inr_crores"
      availability:
        lag_type: "t_plus_1_nsdl_eod"
        lag_days: 1
        status: "verified"
        notes: "SEBI/NSDL reporting published after market close on T or morning of T+1"
    dii_equity_flow:
      name: "DII Net Equity Investment"
      source: "sebi"
      frequency: "daily"
      units: "inr_crores"
      availability:
        lag_type: "t_plus_1_sebi"
        lag_days: 1
        status: "verified"
    sip_monthly_total:
      name: "AMFI Monthly Mutual Fund SIP Contribution"
      source: "amfi"
      frequency: "monthly"
      units: "inr_crores"
      availability:
        lag_type: "monthly_release"
        estimated_lag_calendar_days: 10
        status: "requires_verification"
        lag_methodology: "amfi_press_release_calendar"
        fallback_treatment: "quarantine_from_production"
        notes: "AMFI releases SIP totals between 8th and 14th of following month. Exact date requires point-in-time press release timestamp."

point_in_time_safety:
  enforce_availability_cutoff: true
  allow_unverified_in_research: false  # Quarantine unverified sources from production inference
  quarantine_action: "exclude_or_raise"

date_range:
  start_date: "2009-01-01"
  end_date: "2024-12-31"
  calendar: "NSE"

missing_data_policy:
  equity_prices: "strict_drop_or_market_holiday_align"
  max_forward_fill_days: 3
  macro_forward_fill: true
  anomaly_rejection_z_score: 5.0
